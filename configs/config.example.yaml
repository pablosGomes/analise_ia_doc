# Copie este arquivo para config.yaml (gitignored) e ajuste os caminhos locais.

paths:
  legitimos: datasets/legitimos
  fraude_gerada: datasets/fraude_gerada
  processed: datasets/processed
  modelos: models/  # checkpoints treinados (não versionar pesos grandes no git)

anonimizacao:
  # Reaproveita a lógica de scripts/anonimizar_documento.py do projeto anterior
  # (union de MediaPipe + Haar Cascade em 4 rotações, mascaramento com cor
  # local + ruído gaussiano). Ver docs/documentacao_deteccao_fraude.docx, Seção 6.
  aplicar_em: legitimos
  gerar_metadado_mascara: true

geracao_fraude:
  tecnicas:
    - troca_foto
    - edicao_campos
    - crop_and_move
    - recaptura_tela
    - reimpressao
    - digito_verificador
  variantes_por_documento: 10

features:
  modelo_base: facebook/dinov2-base
  usar_noiseprint: true   # segundo canal via TruFor/NoisePrint++ (Fase B do roadmap)

validacao_dados:
  validar_cpf: true
  validar_mrz: true
  validar_qr: true

treino:
  batch_size: 16
  epochs: 30
  lr: 0.0001
  seed: 42
