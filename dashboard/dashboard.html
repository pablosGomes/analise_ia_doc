<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iadoc — treino ao vivo</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--fg:#e6edf3;--mut:#8b949e;
        --ok:#3fb950;--warn:#d29922;--bad:#f85149;--ac:#58a6ff;--ac2:#bc8cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--bd)}
  header h1{font-size:16px;margin:0;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:0 0 auto}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .sub{color:var(--mut);font-size:12px}
  main{max-width:1150px;margin:0 auto;padding:20px;display:grid;gap:18px}
  .grid{display:grid;gap:18px;grid-template-columns:1fr 1fr}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
  .card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
  .tile{background:#0d1117;border:1px solid var(--bd);border-radius:8px;padding:10px}
  .tile .v{font-size:20px;font-weight:600}
  .tile .k{font-size:11px;color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:4px 6px;border-bottom:1px solid #21262d}
  td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .bar{height:6px;border-radius:3px;background:#21262d;overflow:hidden;margin-top:3px}
  .bar>i{display:block;height:100%;background:var(--ac)}
  .warn{color:var(--warn)} .bad{color:var(--bad)} .ok{color:var(--ok)} .mut{color:var(--mut)}
  svg{width:100%;height:220px;display:block}
  .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:6px;color:var(--mut)}
  .leg i{display:inline-block;width:10px;height:3px;vertical-align:middle;margin-right:5px}
  .empty{color:var(--mut);padding:20px;text-align:center}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>iadoc · detecção de fraude — treino ao vivo</h1>
  <span class="sub" id="runinfo">aguardando conexão…</span>
</header>
<main>
  <div class="card">
    <h2>Estado do gerador</h2>
    <div id="gerador"><div class="empty">sem dados ainda — rode o treino local apontando <code>DASHBOARD_URL</code> para cá.</div></div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Loss por época</h2>
      <svg id="svgLoss" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
      <div class="leg" id="legLoss"></div>
    </div>
    <div class="card">
      <h2>AUC de validação por época</h2>
      <svg id="svgAuc" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
      <div class="leg" id="legAuc"></div>
    </div>
  </div>
</main>
<script>
const CORES=["#58a6ff","#3fb950","#bc8cff","#d29922","#f85149","#39c5cf"];
const est={gerador:null, runs:{}, atual:null};
const $=id=>document.getElementById(id);
const fmt=v=>v==null||isNaN(v)?"—":(+v).toFixed(3);

function processar(ev){
  if(!ev||!ev.tipo) return;
  if(ev.tipo==="estado_gerador") est.gerador=ev;
  else if(ev.tipo==="inicio"){ est.atual=ev.run_id; est.runs[ev.run_id]={ini:ev,epocas:[]}; }
  else if(ev.tipo==="epoca"){
    const r=est.runs[ev.run_id]||(est.runs[ev.run_id]={ini:null,epocas:[]});
    r.epocas.push(ev); est.atual=ev.run_id;
  }
}
function runAtual(){ return est.runs[est.atual]; }

function tile(k,v){ return `<div class="tile"><div class="v">${v}</div><div class="k">${k}</div></div>`; }
function linhasContagem(obj){
  const ent=Object.entries(obj||{}); if(!ent.length) return "";
  const max=Math.max(...ent.map(e=>e[1]));
  return ent.sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    `<tr><td>${k}</td><td class="n">${v}</td><td style="width:40%"><div class="bar"><i style="width:${100*v/max}%"></i></div></td></tr>`).join("");
}
function linhaAuc(k,v){
  const cls=v>=0.9?"bad":v>=0.75?"warn":"";
  return `<tr><td>${k}</td><td class="n ${cls}">${fmt(v)}</td></tr>`;
}
function renderGerador(){
  const g=est.gerador; if(!g){return;}
  const sep=g.separabilidade_fonte;
  const sepCls=sep>=0.9?"bad":sep>=0.75?"warn":"ok";
  $("gerador").innerHTML=`
    <div class="tiles" style="margin-bottom:14px">
      ${tile("amostras",g.n_amostras)}${tile("fraude",g.n_fraude)}${tile("legítimo",g.n_legitimo)}
      ${tile("AUC agrupada",fmt(g.auc_agrupada))}
      ${tile("separab. fonte",`<span class="${sepCls}">${fmt(sep)}</span>`)}
    </div>
    ${sep>=0.9?`<div class="bad" style="margin:-6px 0 12px">⚠ fontes ${fmt(sep)} separáveis — balancear/separar bid×reais antes do treino real.</div>`:""}
    <div class="grid" style="gap:14px">
      <div><div class="mut" style="font-size:12px;margin-bottom:4px">Fraudes por gerador</div>
        <table>${linhasContagem(g.por_gerador)}</table></div>
      <div><div class="mut" style="font-size:12px;margin-bottom:4px">AUC honesta (mesma fonte)</div>
        <table>
          <tr><td class="mut" colspan=2>leave-one-technique-out</td></tr>
          ${Object.entries(g.loto||{}).map(([k,v])=>linhaAuc(k,v)).join("")}
          <tr><td class="mut" colspan=2>leave-one-generator-out</td></tr>
          ${Object.entries(g.logo||{}).map(([k,v])=>linhaAuc(k,v)).join("")}
        </table></div>
    </div>`;
}

function desenhar(svgId,legId,series,ymin,ymax,ref){
  const svg=$(svgId), W=600,H=220,ml=42,mr=10,mt=12,mb=24;
  const todos=series.flatMap(s=>s.pts);
  if(!todos.length){ svg.innerHTML=`<text x="300" y="110" fill="#8b949e" text-anchor="middle">sem épocas ainda</text>`; $(legId).innerHTML=""; return; }
  const xs=todos.map(p=>p[0]); const xmax=Math.max(...xs,1), xmin=Math.min(...xs);
  let lo=ymin, hi=ymax;
  if(lo==null){ const ys=todos.map(p=>p[1]); lo=Math.min(...ys); hi=Math.max(...ys); const pad=(hi-lo)*0.1||0.1; lo-=pad; hi+=pad; }
  const X=x=>ml+(xmax===xmin?0:(x-xmin)/(xmax-xmin))*(W-ml-mr);
  const Y=y=>mt+(1-(y-lo)/((hi-lo)||1))*(H-mt-mb);
  let g=`<line x1="${ml}" y1="${mt}" x2="${ml}" y2="${H-mb}" stroke="#30363d"/><line x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}" stroke="#30363d"/>`;
  for(let i=0;i<=4;i++){const yv=lo+(hi-lo)*i/4; const yy=Y(yv); g+=`<line x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}" stroke="#21262d"/><text x="${ml-5}" y="${yy+3}" fill="#8b949e" font-size="10" text-anchor="end">${yv.toFixed(2)}</text>`;}
  if(ref!=null){const yy=Y(ref); g+=`<line x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}" stroke="#8b949e" stroke-dasharray="4 4" opacity=".6"/>`;}
  g+=`<text x="${W-mr}" y="${H-8}" fill="#8b949e" font-size="10" text-anchor="end">época ${xmax}</text>`;
  series.forEach((s,i)=>{ const c=CORES[i%CORES.length];
    const d=s.pts.map((p,j)=>(j?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
    g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="1.8"/>`; });
  svg.innerHTML=g;
  $(legId).innerHTML=series.map((s,i)=>`<span><i style="background:${CORES[i%CORES.length]}"></i>${s.nome}</span>`).join("");
}
function renderCharts(){
  const r=runAtual(); const ep=r?r.epocas:[];
  desenhar("svgLoss","legLoss",[
    {nome:"treino",pts:ep.map(e=>[e.epoca,e.loss_treino])},
    {nome:"validação",pts:ep.map(e=>[e.epoca,e.loss_val])},
  ],null,null,null);
  const tecs=new Set(); ep.forEach(e=>Object.keys(e.auc_por_tecnica||{}).forEach(t=>tecs.add(t)));
  const sAuc=[{nome:"val (geral)",pts:ep.map(e=>[e.epoca,e.auc_val])}];
  [...tecs].forEach(t=>sAuc.push({nome:t,pts:ep.filter(e=>e.auc_por_tecnica&&e.auc_por_tecnica[t]!=null).map(e=>[e.epoca,e.auc_por_tecnica[t]])}));
  desenhar("svgAuc","legAuc",sAuc,0,1,0.5);
}
function render(){ renderGerador(); renderCharts();
  const r=runAtual();
  $("runinfo").textContent=r?`run ${est.atual} · ${r.epocas.length}${r.ini?"/"+r.ini.epocas:""} épocas`+(r.ini?` · ${r.ini.dispositivo}`:""):"sem run ativa";
}

let redraw=null;
function agendar(){ if(redraw) return; redraw=setTimeout(()=>{redraw=null;render();},120); }
function conectar(){
  const es=new EventSource("/api/stream");
  es.addEventListener("snapshot",e=>{ (JSON.parse(e.data)||[]).forEach(processar); render(); });
  es.onmessage=e=>{ try{processar(JSON.parse(e.data)); agendar();}catch(_){} };
  es.onopen=()=>$("dot").classList.add("on");
  es.onerror=()=>{ $("dot").classList.remove("on"); };
}
conectar();
</script>
</body>
</html>
